# Dev-only Alembic config, e.g.:
#   uv run alembic revision --autogenerate -m "add x"
# Target database: ORBIT_DB, otherwise <repo>/data/orbit.db (see orbit/config.py).
# The orbit CLI applies migrations itself and does not read this file.

[alembic]
script_location = %(here)s/src/orbit/db/migrations
path_separator = os
